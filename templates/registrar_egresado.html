<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Egresado</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/formulario.css') }}">
</head>
<body>
    <h2>Registrar Egresado</h2>

    <form method="POST">
        <input type="text" name="matricula" placeholder="Matrícula" required><br><br>
        <input type="text" name="nombre" placeholder="Nombre completo" required><br><br>

        <select name="carrera" required>
            <option value="">Seleccione carrera</option>
            <option>Ingeniería en Innovación Agrícola Sustentable</option>
            <option>Ingeniería en Sistemas Computacionales</option>
            <option>Licenciatura en Contaduría</option>
        </select><br><br>

        <input type="text" name="generacion" placeholder="Generación (2014-2019)" required><br><br>

        <select name="estatus" required>
            <option>Egresado</option>
            <option>En seguimiento</option>
            <option>Titulado</option>
        </select><br><br>

        <input type="text" name="domicilio" placeholder="Domicilio"><br><br>

        <select name="genero">
            <option>Masculino</option>
            <option>Femenino</option>
        </select><br><br>

        <input type="text" name="telefono" placeholder="Teléfono"><br><br>
        <input type="email" name="correo" placeholder="Correo electrónico"><br><br>

        <button type="submit">Guardar</button>
    </form>

    <br>
    <a href="{{ url_for('dashboard') }}">Cancelar</a>
</body>
</html>
