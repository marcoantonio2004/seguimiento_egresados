<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Egresado</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/formulario.css') }}">
</head>
<body>
    <div class="container">
        <h2>Registrar Egresado</h2>

        <form method="POST">

            <label for="matricula">Matrícula:</label>
            <input type="text" id="matricula" name="matricula" required>

            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="carrera">Carrera:</label>
            <select id="carrera" name="carrera" required>
                <option value="">Seleccione carrera</option>
                <option>Ingeniería en Innovación Agrícola Sustentable</option>
                <option>Ingeniería en Sistemas Computacionales</option>
                <option>Licenciatura en Contaduría</option>
            </select>

            <label for="generacion">Generación:</label>
            <input type="text" id="generacion" name="generacion" placeholder="2014-2019" required>

            <label for="estatus">Estatus:</label>
            <select id="estatus" name="estatus" required>
                <option>Egresado</option>
                <option>En seguimiento</option>
                <option>Titulado</option>
            </select>

            <label for="domicilio">Domicilio:</label>
            <input type="text" id="domicilio" name="domicilio">

            <label for="genero">Género:</label>
            <select id="genero" name="genero">
                <option>Masculino</option>
                <option>Femenino</option>
            </select>

            <label for="telefono">Teléfono:</label>
            <input type="text" id="telefono" name="telefono">

            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo">

            <button type="submit">Guardar</button>
        </form>

        <br>
        <a href="{{ url_for('dashboard') }}">Cancelar</a>
    </div>
</body>
</html>
