<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <!-- Botón hamburguesa -->
    <button class="toggle-btn">☰</button>

    <div class="dashboard-container">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <!-- Logo -->
            <div class="logo-container">
                <img src="{{ url_for('static', filename='img/umb.png') }}" alt="Logo" class="sidebar-logo">
            </div>

            <h2 class="sidebar-title">Menú</h2>

            <nav class="menu">
                <a href="{{ url_for('egresados.listar_egresados') }}">Egresados</a>
                <a href="{{ url_for('egresados.registrar_egresado') }}">Registrar</a>
            </nav>

            <div class="logout">
                <a href="{{ url_for('auth.logout') }}">Salir</a>
            </div>
        </aside>

        <!-- CONTENIDO -->
        <main class="main-content">
            <h1>Bienvenido al panel del administrador</h1>

            <!-- TARJETAS -->
            <div class="stats">
                <div class="stat-card">
                    <p class="info">Alumnos totales</p>
                    <p class="cantidad">{{ alumnos_totales }}</p>
                </div>

                <div class="stat-card">
                    <p class="info">Egresados</p>
                    <p class="cantidad">{{ total_egresados }}</p>
                </div>

                <div class="stat-card">
                    <p class="info">Titulados</p>
                    <p class="cantidad">{{ total_titulados }}</p>
                </div>

                <div class="stat-card">
                    <p class="info">En seguimiento</p>
                    <p class="cantidad">{{ total_seguimiento }}</p>
                </div>
            </div>

            <!-- GRÁFICA -->
            <div class="chart-container">
                <h2>Estadísticas de alumnos</h2>
                <canvas id="alumnosChart"></canvas>
            </div>
        </main>
    </div>

    <!-- Script hamburguesa -->
    <script>
        const sidebar = document.querySelector('.sidebar');
        const toggleBtn = document.querySelector('.toggle-btn');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });
    </script>

    <!-- Script gráfica -->
    <script>
        const dataEgresados = {{ total_egresados   | default (0) | tojson }};
        const dataTitulados = {{ total_titulados   | default (0) | tojson }};
        const dataSeguimiento = {{ total_seguimiento | default (0) | tojson }};

        const ctx = document.getElementById('alumnosChart').getContext('2d');

        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Egresados', 'Titulados', 'En seguimiento'],
                datasets: [{
                    data: [
                        dataEgresados,
                        dataTitulados,
                        dataSeguimiento
                    ],
                    backgroundColor: [
                        '#388e3c',
                        '#1976d2',
                        '#fbc02d'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom'
                    }
                },
                cutout: '60%' // tamaño del hueco central
            }
        });
    </script>


</body>

</html>
