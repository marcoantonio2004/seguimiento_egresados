<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
    <div class="dashboard-container">

        <!-- MENÚ LATERAL -->
        <aside class="sidebar">
            <h2>Menú</h2>
            <nav class="menu">
                <a href="{{ url_for('egresados.listar_egresados') }}">Egresados</a>
                <a href="{{ url_for('egresados.registrar_egresado') }}">Registrar</a>
                <a href="{{ url_for('auth.logout') }}">Salir</a>
            </nav>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            <h1>Bienvenido al Panel del Administrador</h1>
            <p class="info">Cantidad de alumnos registrados: <span class="cantidad">{{ cantidad_alumnos }}</span></p>
            <p>Seleccione una opción del menú a la izquierda.</p>
        </main>

    </div>
</body>
</html>
