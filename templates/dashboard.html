<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <!-- Estilos globales y específicos -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
    <!-- Botón hamburguesa para móviles -->
    <button class="toggle-btn">☰</button>

    <div class="dashboard-container">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <h2>Menú</h2>
            <nav class="menu">
                <a href="{{ url_for('egresados.listar_egresados') }}">Egresados</a>
                <a href="{{ url_for('egresados.registrar_egresado') }}">Registrar</a>
                <a href="{{ url_for('auth.logout') }}">Salir</a>
            </nav>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            <h1>Bienvenido al panel del administrador</h1>

            <!-- TARJETAS DE ESTADÍSTICAS -->
            <div class="stats">
                <div class="stat-card">
                    <p class="info">Alumnos totales</p>
                    <p class="cantidad">{{ alumnos_totales }}</p>
                </div>

                <div class="stat-card">
                    <p class="info">Egresados</p>
                    <p class="cantidad">{{ total_egresados }}</p>
                </div>

                <div class="stat-card">
                    <p class="info">Titulados</p>
                    <p class="cantidad">{{ total_titulados }}</p>
                </div>

                <div class="stat-card">
                    <p class="info">En seguimiento</p>
                    <p class="cantidad">{{ total_seguimiento }}</p>
                </div>
            </div>

            <p>Seleccione una opción del menú para comenzar.</p>
        </main>

    </div>

    <!-- Script para toggle del menú en móviles -->
    <script>
        const sidebar = document.querySelector('.sidebar');
        const toggleBtn = document.querySelector('.toggle-btn');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });
    </script>
</body>
</html>
